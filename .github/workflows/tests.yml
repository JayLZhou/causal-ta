name: 核心机制与安装验证
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m causal_ta.validate
      - run: python -m unittest discover -s tests -v
      - name: 离线 TA 固定场景评测
        run: python tools/evaluate_tutor.py --output .data/evaluations/ci-offline.json
      - name: 安装构建工具
        run: python -m pip install build twine "setuptools>=77.0.3"
      - name: 从源码发行包构建 wheel
        run: python -m build --no-isolation
      - name: 检查发行元数据
        run: python -c "from pathlib import Path; import subprocess, sys; subprocess.run([sys.executable, '-m', 'twine', 'check', *map(str, Path('dist').glob('*'))], check=True)"
      - name: 在源码目录外验证真实安装
        run: python -c "from pathlib import Path; import subprocess, sys; wheels=list(Path('dist').glob('*.whl')); assert len(wheels)==1; subprocess.run([sys.executable, 'tools/check_install.py', str(wheels[0])], check=True)"
      - name: 合成研究演练
        run: python tools/demo_study.py
      - name: 打包独立源码
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python tools/export_release.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          name: causal-ta-release-candidate
          path: dist/
          if-no-files-found: error
